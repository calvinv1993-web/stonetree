<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SORTIA · Parallax preview</title>
<link rel="stylesheet" href="parallax.css">
<script src="scene-data.js" defer></script>
<script src="parallax.js" defer></script>
</head>
<body>
<main class="parallax">
  <div class="viewport" aria-label="SORTIA story panorama. Swipe left for the next scene." tabindex="0">
    <div class="world"></div>
    <div class="vignette" aria-hidden="true"></div>
  </div>
  <section class="caption">
    <p class="chapter">SORTIA · The Broken Seal</p>
    <h1>The Broken Seal</h1>
    <p class="copy"></p>
    <nav aria-label="Scene navigation">
      <button class="back" aria-label="Previous scene" type="button">←</button>
      <span class="count" aria-live="polite">1 / 5</span>
      <button class="next" type="button">Continue →</button>
    </nav>
  </section>
</main>
</body>
</html>
