<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c141b">
  <title>SORTIA · Log in</title>
  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
</head>
<body>
  <main class="login" data-sortia-login data-auth-mode="login">
    <header class="scene">
      <img class="scene__art" src="assets/oakvale-login.webp" width="1536" height="1024" alt="">
      <div class="brand">
        <img class="brand__mark" src="assets/sortia-wordmark.webp" width="2161" height="592" alt="SORTIA">
        <div class="brand__chapter">The Broken Seal</div>
      </div>
    </header>
    <section class="access" aria-labelledby="access-title">
      <div class="ornament" aria-hidden="true"><span></span></div>
      <h1 id="access-title" tabindex="-1">Log in</h1>
      <form class="form" method="dialog">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" name="email" inputmode="email" autocomplete="username"
            placeholder="name@example.com" spellcheck="false" autocapitalize="none" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password">
            <input id="password" type="password" name="password" autocomplete="current-password" required>
            <button class="password__toggle" type="button" aria-controls="password" aria-label="Show password">Show</button>
          </div>
        </div>
        <button class="primary" type="submit">Log in</button>
      </form>
      <div class="switch">
        <span class="switch__hint">New to Sortia?</span>
        <button type="button" class="switch__action">Create account</button>
      </div>
      <p class="status" role="status"></p>
    </section>
  </main>
</body>
</html>
