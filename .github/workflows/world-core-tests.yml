name: World core tests
on:
  push:
    branches: [rebuild/world-core-v1]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test multi-building-test/building.test.cjs
