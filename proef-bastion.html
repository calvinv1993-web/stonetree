<!doctype html>
<!-- A picture trial on its own, apart from the game (the owner's sortia-bastion-parallax-v2: one scene of 1829 x 3200 in
     three depths, back to front): the far forest and sky (1957 x 1728 at -64, -64), moving at most 32 x 24 of its pixels
     against the main depth; the near winter tree (1164 x 914 at -192, -64), the same way but at most 12 x 8; and the main
     depth (Bastion, the wolf, the villagers, the bridge, the path) in two strips at 0 and 1400, both always with one and
     the same transform. Its camera as the package's: the whole height (no wider than 1450 of its pixels), centred on
     x 1039.5 within the picture. Opened from the gate: three taps on the SORTIA logo. Nothing here changes the story. -->
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09131c">
<title>SORTIA proef: Bastion</title>
<script src="sprites/versions.js"></script>
<style>
@font-face { font-family: 'Cinzel'; font-weight: 600; font-display: swap; src: url(css/fonts/cinzel-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Literata'; font-weight: 400; font-display: swap; src: url(css/fonts/literata-latin-400-normal.woff2) format('woff2'); }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; background: #09131c; color: #ecd0a0; font: 14px system-ui, sans-serif; }
#view { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
#scene { position: absolute; left: 0; top: 0; width: 1829px; height: 3200px; transform-origin: 0 0; overflow: hidden; }
#far { position: absolute; left: -64px; top: -64px; width: 1957px; height: 1728px; max-width: none; will-change: transform; }
#near { position: absolute; left: -192px; top: -64px; width: 1164px; height: 914px; max-width: none; will-change: transform; }
#main img { position: absolute; left: 0; width: 1829px; height: 1800px; max-width: none; display: block; }
#top { top: 0; }
#bottom { top: 1400px; }
.line { display: none; position: absolute; left: 0; width: 1829px; height: 6px; background: #ffd45b; z-index: 2; }
.show .line { display: block; }
#start { top: 1397px; }
#end { top: 1797px; }
nav { position: fixed; z-index: 4; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
button { background: #101c28e8; border: 1px solid #aa9270; color: #f4e0b7; border-radius: 7px; padding: 9px 10px; font: inherit; }
button[aria-pressed="true"] { background: #77572e; }
button:disabled { opacity: .45; }
#back { margin-right: auto; }
#copy { display: none; position: fixed; z-index: 3; left: 0; right: 0; bottom: 0; padding: 0 max(22px, env(safe-area-inset-left)) max(26px, calc(env(safe-area-inset-bottom) + 15px));
  background: linear-gradient(transparent, #0b1219ee 30%, #0b1219); pointer-events: none; }
#copy::before { content: ''; display: block; height: 70px; }
#copy h1 { font: 600 clamp(24px, 6.6vw, 34px) / 1.15 'Cinzel', Georgia, serif; color: #e3c48c; margin: 0 0 12px; }
#copy p { font: 400 clamp(16px, 4.1vw, 19px) / 1.55 'Literata', Georgia, serif; color: #efe6d8; margin: 0; max-width: 34em; }
#status { position: fixed; z-index: 4; bottom: max(9px, env(safe-area-inset-bottom)); left: 12px; background: #08121bcc; padding: 5px 8px; font-size: 11px; color: #c8d4e1; pointer-events: none; }
.text-on #status { display: none; }
</style></head>
<body>
<div id="view"><div id="scene">
  <img id="far" alt="Verre achtergrond" decoding="async">
  <img id="near" alt="Nabije winterboom" decoding="async">
  <div id="main"><img id="top" alt="Hoofdlaag, bovenste strook" decoding="async"><img id="bottom" alt="Hoofdlaag, onderste strook" decoding="async"></div>
  <div class="line" id="start"></div><div class="line" id="end"></div>
</div></div>
<nav>
  <button id="back" type="button">&larr; Terug</button>
  <button id="parallax" type="button" aria-pressed="true">Parallax</button>
  <button id="demo" type="button" aria-pressed="false">Demo</button>
  <button id="whole" type="button" aria-pressed="false">Geheel</button>
  <button id="pixels" type="button" aria-pressed="false">100%</button>
  <button id="seam" type="button" aria-pressed="false">Overlap</button>
  <button id="text" type="button" aria-pressed="false">Tekst</button>
</nav>
<section id="copy"><h1>Bastion Holds the Crossing</h1>
  <p>At the narrow crossing, a shield-bearer turns to face the wolves. He holds the bridge while the villagers pass behind him. You follow them into the trees.</p></section>
<div id="status"></div>
<script>
'use strict';
(() => { // (in a function of its own: top and left would clash with the window's own)
// each picture by its own version (sprites/versions.js), so a new one is fetched and an unchanged one isn't
const pic = f => { const k = `ui/proef/bastion/${f}`, h = typeof SPRITE_HASHES !== 'undefined' && SPRITE_HASHES[k]; return `sprites/${k}${h ? `?h=${h}` : ''}`; };
const $ = id => document.getElementById(id), view = $('view'), scene = $('scene'), far = $('far'), near = $('near');
far.src = pic('01-ver-bos.png'); near.src = pic('02-nabije-boom.png');
$('top').src = pic('03-hoofd-boven.png'); $('bottom').src = pic('04-hoofd-onder.png');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
let enabled = !reduced.matches, mode = 'fit', auto = false, frame = 0, drag = null, scale = 1, left = 0, top = 0, dx = 0, dy = 0;
function sync() {
  $('parallax').setAttribute('aria-pressed', String(enabled)); $('demo').setAttribute('aria-pressed', String(auto));
  $('pixels').setAttribute('aria-pressed', String(mode === 'pixels')); $('whole').setAttribute('aria-pressed', String(mode === 'whole'));
  $('parallax').disabled = reduced.matches; $('demo').disabled = reduced.matches || !enabled;
}
// the two back depths' own shift against the main depth, in the scene's pixels: the far forest at most 32 x 24, the near
// tree the same way at most 12 x 8
function offset(x = 0, y = 0) {
  dx = enabled ? clamp(x, -32, 32) : 0; dy = enabled ? clamp(y, -24, 24) : 0;
  far.style.transform = `translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px)`;
  near.style.transform = `translate(${(dx * 12 / 32).toFixed(2)}px, ${(dy * 8 / 24).toFixed(2)}px)`;
  status();
}
function place() { scene.style.transform = `scale(${scale})`; scene.style.left = `${left}px`; scene.style.top = `${top}px`; }
// the package's camera: the whole height, no wider than 1450 of its pixels, centred on x 1039.5 within the picture; or the
// whole scene; or one picture pixel to one screen pixel (drag to look around)
function fit() {
  const w = view.clientWidth, h = view.clientHeight, d = devicePixelRatio || 1;
  scale = mode === 'pixels' ? 1 / d : mode === 'whole' ? Math.min(w / 1829, h / 3200) : Math.min(h / 3200, w / 1450);
  const sw = 1829 * scale, sh = 3200 * scale;
  left = sw > w ? -clamp(1039.5 - w / (2 * scale), 0, 1829 - w / scale) * scale : (w - sw) / 2;
  top = mode === 'pixels' && sh > h ? 0 : (h - sh) / 2;
  place(); status(); sync();
}
function status() { $('status').textContent = `3 dieptelagen · ${(scale * (devicePixelRatio || 1)).toFixed(3)} schermpixel per beeldpixel · verte ${dx.toFixed(0)}, ${dy.toFixed(0)}${mode === 'pixels' ? ' · sleep om rond te kijken' : ''}`; }
function run(t) { if (!auto || !enabled || document.hidden) return; offset(Math.sin(t / 1700) * 32, Math.cos(t / 2100) * 24); frame = requestAnimationFrame(run); }
function stop() { auto = false; cancelAnimationFrame(frame); frame = 0; offset(); sync(); }
$('parallax').onclick = () => { if (reduced.matches) return; enabled = !enabled; if (!enabled) stop(); offset(); sync(); };
$('demo').onclick = () => { if (reduced.matches || !enabled) return; auto = !auto; cancelAnimationFrame(frame); frame = 0; if (auto) frame = requestAnimationFrame(run); else offset(); sync(); };
$('pixels').onclick = () => { mode = mode === 'pixels' ? 'fit' : 'pixels'; fit(); };
$('whole').onclick = () => { mode = mode === 'whole' ? 'fit' : 'whole'; fit(); };
const toggle = (id, fn) => { $(id).onclick = e => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', String(on)); fn(on); }; };
toggle('seam', on => scene.classList.toggle('show', on));
toggle('text', on => { $('copy').style.display = on ? 'block' : 'none'; document.body.classList.toggle('text-on', on); });
$('back').onclick = () => { location.href = 'index.html'; };
// a finger (or the mouse) on the picture moves the back depths: from the middle of the screen to an edge is their whole
// way; letting go, they go back to rest. At 100% a finger drags the view instead. None of it with reduced motion.
const lean = e => { const r = view.getBoundingClientRect(); offset(((e.clientX - r.left) / r.width - 0.5) * 64, ((e.clientY - r.top) / r.height - 0.5) * 48); };
view.addEventListener('pointerdown', e => {
  if (mode === 'pixels') { drag = { x: e.clientX, y: e.clientY, left, top }; view.setPointerCapture(e.pointerId); return; }
  if (!auto && !reduced.matches) lean(e);
});
view.addEventListener('pointermove', e => {
  if (drag) { const w = view.clientWidth, h = view.clientHeight, sw = 1829 * scale, sh = 3200 * scale;
    left = sw > w ? clamp(drag.left + e.clientX - drag.x, w - sw, 0) : (w - sw) / 2; top = sh > h ? clamp(drag.top + e.clientY - drag.y, h - sh, 0) : (h - sh) / 2; place(); return; }
  if (auto || reduced.matches || mode === 'pixels') return;
  if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) lean(e);
});
const rest = () => { drag = null; if (!auto) offset(); };
view.addEventListener('pointerup', rest); view.addEventListener('pointercancel', rest);
view.addEventListener('pointerleave', () => { if (!auto && !drag) offset(); });
document.addEventListener('visibilitychange', () => { cancelAnimationFrame(frame); frame = 0; if (auto && !document.hidden) frame = requestAnimationFrame(run); });
reduced.addEventListener('change', () => { if (reduced.matches) { enabled = false; stop(); } else { enabled = true; offset(); } sync(); });
new ResizeObserver(fit).observe(view);
addEventListener('resize', fit);
fit();
})();
</script>
</body></html>
