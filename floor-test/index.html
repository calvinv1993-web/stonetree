<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stonetree Floor Test</title><style>*{box-sizing:border-box}body{margin:0;background:#14251e;color:#f4e5b3;font:14px system-ui}#app{height:100dvh;display:flex;flex-direction:column}#area{flex:1;min-height:0;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated}#hud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;background:#15251edc;padding:8px;border-radius:8px}#bar{height:75px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;border-top:1px solid #546c4e}#message{flex:1}button{background:#37523e;color:#f4e5b3;border:1px solid #b2aa70;border-radius:8px;padding:12px}</style><div id="app"><div id="area"><canvas id="game"></canvas><div id="hud">STONETREE · <span id="coords">Z7</span></div></div><div id="bar"><span id="message">Tik op de kaart. Zoek de gouden trap.</span><button id="reset">Reset</button></div></div><script>(function(){'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),msg=document.getElementById('message');let p={x:-2,y:2,z:7},size=32,active=false,run=0;const stairs={x:3,y:-2},inside=(x,y)=>x>=0&&x<=6&&y>=-5&&y<=1;function terrain(x,y,z){if(z===6){if(!inside(x,y))return 'void';if(x===0||x===6||y===-5||y===1)return 'wall';if(x===3&&y===-2)return 'stairs';if(x===1&&y===-3)return 'hole';return 'wood'}if(inside(x,y)){if(x===0||x===6||y===-5||y===1)return x===0&&y===0?'door':'wall';return x===3&&y===-2?'stairs':'stone'}let h=(Math.imul(x,374761393)^Math.imul(y,668265263))>>>0;h=(Math.imul(h^(h>>>13),1274126177)>>>0)%100;return h<8?'wall':h<25?'mud':h<31?'water':'grass'}const free=(x,y,z)=>!['wall','water','void','hole'].includes(terrain(x,y,z));function render(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);size=32;const cell=size*d,cx=canvas.width/2,cy=canvas.height/2,cols=Math.ceil(canvas.width/cell/2)+1,rows=Math.ceil(canvas.height/cell/2)+1,colors={grass:'#587d4d',mud:'#826543',water:'#315d6b',wall:'#293b34',door:'#b49358',stone:'#898778',wood:'#a17b50',stairs:'#e6bc64',void:'#192b25',hole:'#365347'};for(let dy=-rows;dy<=rows;dy++)for(let dx=-cols;dx<=cols;dx++){const x=p.x+dx,y=p.y+dy,t=terrain(x,y,p.z),xx=cx+dx*cell-cell/2,yy=cy+dy*cell-cell/2;ctx.fillStyle=colors[t];ctx.fillRect(xx,yy,cell+1,cell+1);ctx.strokeStyle='#12221944';ctx.strokeRect(xx,yy,cell,cell);if(t==='stairs'){ctx.fillStyle='#72502c';for(let i=0;i<3;i++)ctx.fillRect(xx+cell*.16,yy+cell*(.22+i*.2),cell*.68,cell*.08)}else if(t==='wall'){ctx.fillStyle='#4a5a49';ctx.fillRect(xx+2,yy+3,cell-4,cell*.27)}else if(t==='grass'){ctx.fillStyle='#8caa70';ctx.fillRect(xx+cell*.3,yy+cell*.3,cell*.08,cell*.17)}else if(t==='hole'){ctx.fillStyle='#536c57';ctx.fillRect(xx+cell*.15,yy+cell*.15,cell*.7,cell*.7)}}ctx.fillStyle='#f1cc78';ctx.fillRect(cx-cell*.25,cy-cell*.28,cell*.5,cell*.65);ctx.fillStyle='#493728';ctx.fillRect(cx-cell*.18,cy-cell*.24,cell*.36,cell*.18);ctx.strokeStyle='#fff0ac';ctx.strokeRect(cx-cell*.25,cy-cell*.28,cell*.5,cell*.65);document.getElementById('coords').textContent=p.x+','+p.y+' · Z'+p.z}function path(tx,ty){const key=(x,y)=>x+','+y,start=key(p.x,p.y),open=[{x:p.x,y:p.y,g:0}],cost=new Map([[start,0]]),prev=new Map();let iterations=0;while(open.length&&iterations++<1800){open.sort((a,b)=>(a.g+Math.abs(a.x-tx)+Math.abs(a.y-ty))-(b.g+Math.abs(b.x-tx)+Math.abs(b.y-ty)));const n=open.shift(),k=key(n.x,n.y);if(n.g!==cost.get(k))continue;if(n.x===tx&&n.y===ty){let at=k,out=[];while(at!==start){const [x,y]=at.split(',').map(Number);out.unshift({x,y});at=prev.get(at)}return out}for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const x=n.x+dx,y=n.y+dy;if(!free(x,y,p.z)||Math.abs(x-p.x)>30||Math.abs(y-p.y)>30)continue;const kk=key(x,y),g=n.g+(terrain(x,y,p.z)==='mud'?3:1);if(g>=(cost.get(kk)??Infinity))continue;cost.set(kk,g);prev.set(kk,k);open.push({x,y,g})}}return null}function switchFloor(){p.z=p.z===7?6:7;msg.textContent=p.z===6?'Bovenverdieping Z6. Tik opnieuw op de trap om af te dalen.':'Begane grond Z7. Tik op de trap om omhoog te gaan.';render()}async function walk(route){active=true;const token=++run;for(const next of route){if(token!==run||!free(next.x,next.y,p.z))break;p.x=next.x;p.y=next.y;render();await new Promise(resolve=>setTimeout(resolve,terrain(p.x,p.y,p.z)==='mud'?220:110))}active=false;if(token===run&&p.x===stairs.x&&p.y===stairs.y)switchFloor()}canvas.addEventListener('pointerup',e=>{if(active)return;const r=canvas.getBoundingClientRect(),x=p.x+Math.floor((e.clientX-r.left-r.width/2)/size+.5),y=p.y+Math.floor((e.clientY-r.top-r.height/2)/size+.5);if(x===p.x&&y===p.y&&x===stairs.x&&y===stairs.y){switchFloor();return}if(!free(x,y,p.z)){msg.textContent='Deze tegel is geblokkeerd.';return}const route=path(x,y);if(route)walk(route);else msg.textContent='Geen route gevonden.'});document.getElementById('reset').onclick=()=>{run++;active=false;p={x:-2,y:2,z:7};msg.textContent='Tik op de kaart. Zoek de gouden trap.';render()};window.addEventListener('resize',render);render()})();</script></html>
