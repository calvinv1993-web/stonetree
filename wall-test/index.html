<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stonetree Wall Test</title><style>*{box-sizing:border-box}body{margin:0;background:#14251e;color:#f4e5b3;font:14px system-ui}#app{height:100dvh;display:flex;flex-direction:column}#area{flex:1;min-height:0;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated}#hud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;background:#15251eea;padding:8px;border-radius:8px}#bar{min-height:80px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;border-top:1px solid #546c4e}#message{flex:1}button{background:#37523e;color:#f4e5b3;border:1px solid #b2aa70;border-radius:8px;padding:12px;white-space:nowrap}</style><div id="app"><div id="area"><canvas id="game"></canvas><div id="hud">STONETREE · <span id="coords">Z7</span></div></div><div id="bar"><span id="message">Twee deuren en twee ramen. Tik op een deur.</span><button id="reset">Reset</button></div></div><script>(function(){'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),msg=document.getElementById('message'),stairs={x:3,y:-2},doors=[{x:0,y:0,open:false},{x:6,y:-2,open:false}],windows=[{x:2,y:-5},{x:4,y:1}];let p={x:-2,y:2,z:7},walking=false,token=0;const roof={x:0,y:-5,w:7,h:7};const upstairsHole={x:1,y:-3};const S=40;const inside=(x,y)=>x>=0&&x<=6&&y>=-5&&y<=1;function wall(x,y){return inside(x,y)&&(x===0||x===6||y===-5||y===1)}function wallMask(x,y){let mask=0;for(const [dx,dy,bit] of [[0,-1,1],[1,0,2],[0,1,4],[-1,0,8]])if(wall(x+dx,y+dy))mask|=bit;return mask}function getDoor(x,y){return doors.find(d=>d.x===x&&d.y===y)}function isWindow(x,y){return windows.some(w=>w.x===x&&w.y===y)}function tile(x,y,z){if(z===6){if(!inside(x,y))return 'void';if(wall(x,y))return 'wall';if(x===3&&y===-2)return 'stairs';return x===upstairsHole.x&&y===upstairsHole.y?'hole':'wood'}if(inside(x,y)){const d=getDoor(x,y);if(d)return d.open?'openDoor':'closedDoor';if(isWindow(x,y))return 'window';if(wall(x,y))return 'wall';return x===3&&y===-2?'stairs':'stone'}const n=(Math.imul(x,374761393)^Math.imul(y,668265263))>>>0,k=(Math.imul(n^(n>>>13),1274126177)>>>0)%100;return k<8?'rock':k<25?'mud':k<31?'water':'grass'}const underRoof=(x,y)=>x>=roof.x&&x<roof.x+roof.w&&y>=roof.y&&y<roof.y+roof.h;function roofVisible(){if(p.z!==7||inside(p.x,p.y))return false;const dx=Math.max(roof.x-p.x,0,p.x-(roof.x+roof.w-1)),dy=Math.max(roof.y-p.y,0,p.y-(roof.y+roof.h-1));return Math.max(dx,dy)>2}function visibleTile(x,y){const t=tile(x,y,p.z);if(p.z===6&&t==='hole')return 'hole';if(roofVisible()&&underRoof(x,y))return 'roof';return t}const blocked=t=>['wall','window','closedDoor','water','rock','void','hole'].includes(t);function render(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),cell=S*d;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);const cx=canvas.width/2,cy=canvas.height/2,cols=Math.ceil(canvas.width/cell/2)+1,rows=Math.ceil(canvas.height/cell/2)+1,colors={grass:'#587d4d',mud:'#826543',water:'#315d6b',rock:'#35463b',wall:'#293b34',window:'#638c91',closedDoor:'#b49358',openDoor:'#928873',stone:'#898778',wood:'#a17b50',stairs:'#e6bc64',void:'#192b25',hole:'#365347',roof:'#665744'};for(let dy=-rows;dy<=rows;dy++)for(let dx=-cols;dx<=cols;dx++){const x=p.x+dx,y=p.y+dy,t=visibleTile(x,y),xx=cx+dx*cell-cell/2,yy=cy+dy*cell-cell/2;ctx.fillStyle=colors[t];ctx.fillRect(xx,yy,cell+1,cell+1);ctx.strokeStyle='#12221944';ctx.strokeRect(xx,yy,cell,cell);if(t==='roof'){ctx.fillStyle='#917a58';for(let i=0;i<4;i++)ctx.fillRect(xx+cell*.05,yy+cell*(i*.25+.05),cell*.9,cell*.045);ctx.fillStyle='#d0b17a';ctx.fillRect(xx+cell*.08,yy+cell*.07,cell*.84,cell*.08)}else if(t==='wall'&&inside(x,y)){const m=wallMask(x,y);ctx.fillStyle='#586d59';ctx.fillRect(xx+cell*.1,yy+cell*.1,cell*.8,cell*.8);ctx.fillStyle='#a2ae8c';if(m&1)ctx.fillRect(xx+cell*.32,yy,cell*.36,cell*.5);if(m&4)ctx.fillRect(xx+cell*.32,yy+cell*.5,cell*.36,cell*.5);if(m&2)ctx.fillRect(xx+cell*.5,yy+cell*.32,cell*.5,cell*.36);if(m&8)ctx.fillRect(xx,yy+cell*.32,cell*.5,cell*.36);ctx.fillStyle='#d1d0ab';ctx.fillRect(xx+cell*.36,yy+cell*.36,cell*.28,cell*.28)}else if(t==='window'){ctx.fillStyle='#c3e2dd';ctx.fillRect(xx+cell*.14,yy+cell*.15,cell*.72,cell*.7);ctx.fillStyle='#314f5b';ctx.fillRect(xx+cell*.44,yy+cell*.15,cell*.12,cell*.7);ctx.fillRect(xx+cell*.14,yy+cell*.44,cell*.72,cell*.12)}else if(t==='closedDoor'||t==='openDoor'){ctx.fillStyle=t==='closedDoor'?'#6b452a':'#344b37';ctx.fillRect(xx+cell*.2,yy+cell*.12,cell*.6,cell*.76);ctx.fillStyle='#e3c679';ctx.fillRect(xx+cell*.67,yy+cell*.48,cell*.08,cell*.08)}else if(t==='stairs'){ctx.fillStyle='#72502c';for(let i=0;i<3;i++)ctx.fillRect(xx+cell*.16,yy+cell*(.22+i*.2),cell*.68,cell*.08)}else if(t==='hole'){ctx.fillStyle='#1a3028';ctx.fillRect(xx+cell*.12,yy+cell*.12,cell*.76,cell*.76);ctx.strokeStyle='#d9c092';ctx.strokeRect(xx+cell*.12,yy+cell*.12,cell*.76,cell*.76)}else if(t==='grass'){ctx.fillStyle='#8caa70';ctx.fillRect(xx+cell*.3,yy+cell*.3,cell*.08,cell*.17)}}ctx.fillStyle='#f1cc78';ctx.fillRect(cx-cell*.25,cy-cell*.28,cell*.5,cell*.65);ctx.fillStyle='#493728';ctx.fillRect(cx-cell*.18,cy-cell*.24,cell*.36,cell*.18);ctx.strokeStyle='#fff0ac';ctx.strokeRect(cx-cell*.25,cy-cell*.28,cell*.5,cell*.65);document.getElementById('coords').textContent=p.x+','+p.y+' · Z'+p.z}function path(tx,ty){const key=(x,y)=>x+','+y,start=key(p.x,p.y),open=[{x:p.x,y:p.y,g:0}],cost=new Map([[start,0]]),prev=new Map();let count=0;while(open.length&&count++<1600){open.sort((a,b)=>(a.g+Math.abs(a.x-tx)+Math.abs(a.y-ty))-(b.g+Math.abs(b.x-tx)+Math.abs(b.y-ty)));const n=open.shift(),k=key(n.x,n.y);if(n.g!==cost.get(k))continue;if(n.x===tx&&n.y===ty){const result=[];let cur=k;while(cur!==start){const [x,y]=cur.split(',').map(Number);result.unshift({x,y});cur=prev.get(cur)}return result}for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const x=n.x+dx,y=n.y+dy;if(blocked(tile(x,y,p.z))||Math.abs(x-p.x)>30||Math.abs(y-p.y)>30)continue;const kk=key(x,y),g=n.g+(tile(x,y,p.z)==='mud'?3:1);if(g>=(cost.get(kk)??Infinity))continue;cost.set(kk,g);prev.set(kk,k);open.push({x,y,g})}}return null}function floor(){if(p.x!==stairs.x||p.y!==stairs.y)return;p.z=p.z===7?6:7;msg.textContent=p.z===6?'Boven Z6. Tik op de trap om terug te gaan.':'Beneden Z7. De deur kan open en dicht.';render()}async function walk(route){walking=true;const id=++token;for(const q of route){if(id!==token||blocked(tile(q.x,q.y,p.z)))break;p.x=q.x;p.y=q.y;render();await new Promise(r=>setTimeout(r,tile(p.x,p.y,p.z)==='mud'?230:110))}walking=false;if(id===token&&p.x===stairs.x&&p.y===stairs.y)floor()}async function interactDoor(door){
 if(walking)return;
 const distance=Math.abs(p.x-door.x)+Math.abs(p.y-door.y);
 if(distance!==1){
  const targets=[[0,-1],[1,0],[0,1],[-1,0]].map(([dx,dy])=>({x:door.x+dx,y:door.y+dy})).filter(q=>!blocked(tile(q.x,q.y,p.z)));
  const choices=targets.map(q=>path(q.x,q.y)).filter(route=>route!==null).sort((a,b)=>a.length-b.length);
  if(!choices.length){msg.textContent='Je kunt de deur niet bereiken.';return}
  msg.textContent='Je loopt naar de deur…';
  await walk(choices[0]);
 }
 if(p.z!==7||Math.abs(p.x-door.x)+Math.abs(p.y-door.y)!==1)return;
 if(door.open&&p.x===door.x&&p.y===door.y){msg.textContent='Je staat in de deuropening.';return}
 door.open=!door.open;
 msg.textContent=door.open?'Deur geopend. Tik binnen om door te lopen.':'Deur gesloten. De doorgang is geblokkeerd.';
 render();
}
canvas.addEventListener('pointerup',e=>{if(walking)return;const r=canvas.getBoundingClientRect(),x=p.x+Math.floor((e.clientX-r.left-r.width/2)/S+.5),y=p.y+Math.floor((e.clientY-r.top-r.height/2)/S+.5);if(p.z===7&&getDoor(x,y)){interactDoor(getDoor(x,y));return}if(x===p.x&&y===p.y&&x===stairs.x&&y===stairs.y){floor();return}if(roofVisible()&&underRoof(x,y)){msg.textContent='Het dak bedekt dit gebouw. Open de deur en loop naar binnen.';return}if(blocked(tile(x,y,p.z))){msg.textContent='Geblokkeerde tegel.';return}const route=path(x,y);if(route)walk(route);else msg.textContent='Geen route gevonden.'});document.getElementById('reset').onclick=()=>{token++;walking=false;p={x:-2,y:2,z:7};doors.forEach(d=>d.open=false);msg.textContent='Tik op een deur om erheen te lopen en deze te openen.';render()};window.addEventListener('resize',render);render()})();</script></html>
