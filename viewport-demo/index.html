<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stonetree viewport test</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101a18;color:#e5e4cd;font:16px system-ui}main{max-width:720px;margin:auto;padding:16px}h1{color:#e9dba8;font-size:23px}.panel{background:#1b2b26;border:1px solid #405a45;border-radius:12px;padding:12px;margin:12px 0}canvas{width:100%;aspect-ratio:15/11;image-rendering:pixelated;background:#537b4d;border:2px solid #637650;border-radius:7px;touch-action:manipulation}button{background:#344c38;color:#fff0c4;border:1px solid #7d8f64;border-radius:8px;min-width:55px;min-height:44px;font-size:20px}.controls{display:grid;grid-template-columns:repeat(3,60px);gap:5px;justify-content:center}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#24382e;padding:8px;border-radius:7px}.stat strong{display:block;color:#edda94;font-size:20px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.actions button{font-size:14px}small{color:#b4bda9}</style>
<main><h1>STONETREE <small>WORLD ENGINE</small></h1><p>Interactieve viewport-test · 15×11 tiles · 32×32 chunks</p><div class="panel"><canvas id="map" width="600" height="440"></canvas><p><small>Tik op een tegel voor een route. Bruin = modder, donker = muur, blauw = water.</small></p><div class="controls"><button class="up" data-dir="0,-1">↑</button><button class="left" data-dir="-1,0">←</button><button class="down" data-dir="0,1">↓</button><button class="right" data-dir="1,0">→</button></div></div><div class="panel"><div class="stats"><div class="stat">Positie<strong id="pos">0, 0, 7</strong></div><div class="stat">Chunks<strong id="chunks">0</strong></div><div class="stat">Nieuwe tiles<strong id="delta">0</strong></div><div class="stat">Totaal ontvangen<strong id="total">0</strong></div></div><div class="actions"><button id="teleport">Teleport</button><button id="reset">Reset</button></div><p id="status">JavaScript wordt geladen…</p></div></main>
<script>
(function(){
const c=document.getElementById('map'),ctx=c.getContext('2d'),S=40,W=15,H=11;let p={x:0,y:0,z:7},old=null,total=0,walking=false;
const $=id=>document.getElementById(id);
function bounds(){return {l:p.x-7,r:p.x+7,t:p.y-5,b:p.y+5}}
function hash(x,y){let n=Math.imul(x,374761393)+Math.imul(y,668265263);n=Math.imul(n^(n>>>13),1274126177);return (n^(n>>>16))>>>0}
function terrain(x,y){if(Math.abs(x)<=1&&Math.abs(y)<=1)return 'grass';const n=hash(x,y)%100;return n<14?'wall':n<35?'mud':n<43?'water':'grass'}
const color={grass:'#537b4d',mud:'#806444',wall:'#2b3d35',water:'#305e69'};
const free=(x,y)=>!['wall','water'].includes(terrain(x,y));
function update(){const b=bounds();let count=0;for(let y=b.t;y<=b.b;y++)for(let x=b.l;x<=b.r;x++)if(!old||x<old.l||x>old.r||y<old.t||y>old.b)count++;total+=count;old=b;
$('pos').textContent=p.x+', '+p.y+', '+p.z;$('delta').textContent=count;$('total').textContent=total;$('chunks').textContent=(Math.floor(b.r/32)-Math.floor(b.l/32)+1)*(Math.floor(b.b/32)-Math.floor(b.t/32)+1);
$('status').textContent='Actief · viewport X '+b.l+'…'+b.r+' · Y '+b.t+'…'+b.b;draw();}
function draw(){const b=bounds();for(let iy=0;iy<H;iy++)for(let ix=0;ix<W;ix++){const x=b.l+ix,y=b.t+iy,t=terrain(x,y),px=ix*S,py=iy*S;ctx.fillStyle=color[t];ctx.fillRect(px,py,S,S);ctx.fillStyle=t==='grass'?'#83a76b':t==='mud'?'#96784d':t==='water'?'#467d83':'#3c5041';if(t==='grass'){ctx.fillRect(px+8,py+10,3,7);ctx.fillRect(px+25,py+27,4,4)}else if(t==='wall'){ctx.fillRect(px+3,py+4,34,10);ctx.fillRect(px+8,py+20,28,15)}else{ctx.fillRect(px+6,py+11,18,3)}ctx.strokeStyle='#00000018';ctx.strokeRect(px+.5,py+.5,S,S)}ctx.fillStyle='#e6bd68';ctx.fillRect(290,206,20,27);ctx.fillStyle='#59432e';ctx.fillRect(293,207,14,9);ctx.strokeStyle='#fff1aa';ctx.lineWidth=2;ctx.strokeRect(290,206,20,27)}
function step(dx,dy){if(!free(p.x+dx,p.y+dy))return false;p.x+=dx;p.y+=dy;update();return true}
function pathTo(goal){const start={...p},key=(x,y)=>x+','+y,open=[{x:p.x,y:p.y,g:0}],best=new Map([[key(p.x,p.y),0]]),prev=new Map();let iterations=0;while(open.length&&iterations++<1200){open.sort((a,b)=>a.g+Math.abs(a.x-goal.x)+Math.abs(a.y-goal.y)-b.g-Math.abs(b.x-goal.x)-Math.abs(b.y-goal.y));const q=open.shift(),k=key(q.x,q.y);if(q.g!==best.get(k))continue;if(q.x===goal.x&&q.y===goal.y){const path=[];let cur=k;while(cur!==key(start.x,start.y)){const [x,y]=cur.split(',').map(Number);path.unshift({x,y});cur=prev.get(cur)}return path}for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const x=q.x+dx,y=q.y+dy;if(!free(x,y)||Math.abs(x-start.x)>18||Math.abs(y-start.y)>15)continue;const k2=key(x,y),g=q.g+(terrain(x,y)==='mud'?3:1);if(g>=(best.get(k2)??Infinity))continue;best.set(k2,g);prev.set(k2,k);open.push({x,y,g})}}return null}
async function follow(path){walking=true;for(const t of path){if(!step(t.x-p.x,t.y-p.y))break;await new Promise(r=>setTimeout(r,terrain(p.x,p.y)==='mud'?260:100))}walking=false}
c.addEventListener('click',e=>{if(walking)return;const r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H),b=bounds();const path=pathTo({x:b.l+x,y:b.t+y});if(path)follow(path)});
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{if(!walking){const [dx,dy]=b.dataset.dir.split(',').map(Number);step(dx,dy)}});
window.addEventListener('keydown',e=>{const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(d){e.preventDefault();if(!walking)step(...d)}});
$('teleport').onclick=()=>{if(walking)return;p={x:1024,y:768,z:7};old=null;update()};$('reset').onclick=()=>{if(walking)return;p={x:0,y:0,z:7};old=null;total=0;update()};update();
})();
</script></html>
