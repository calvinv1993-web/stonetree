<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Stonetree — 2.5D rastertest</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171a1b}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}</style><canvas id="map"></canvas><script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const TILE=40,N=5,WALL=64,THICK=6;
const player={x:2,y:2,z:0};let path=[];let originX=0,originY=0;
const STAIRS={x:1,y:1},DOOR_X=2;
function inside(x,y){return x>=0&&x<N&&y>=0&&y<N;}
function walkable(x,y){return inside(x,y)||(player.z===0&&x===DOOR_X&&y>=N&&y<=N+5)||(player.z===0&&y>=N+1&&y<=N+5&&x>=-7&&x<N+8);}
function stairsAt(x,y){return x===STAIRS.x&&y===STAIRS.y;}
function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath();ctx.fill();}
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function paint(){
 const d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
 canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);
 ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingEnabled=false;
 ctx.fillStyle='#171a1b';ctx.fillRect(0,0,w,h);
 // Camera follows the player's world tile; the building stays on the grid.
 const size=N*TILE;
 const x=Math.round(w/2-(player.x+.5)*TILE);
 // On the upper floor the entire playable floor is elevated in screen space.
 const elevation=player.z*WALL;
 const y=Math.round(h/2-(player.y+.5)*TILE+elevation);
 const outside=!inside(player.x,player.y);
 originX=x;originY=y;
 // Grass on the surrounding world grid.
 const minGX=Math.floor(-x/TILE)-1,maxGX=Math.ceil((w-x)/TILE)+1;
 const minGY=Math.floor(-y/TILE)-1,maxGY=Math.ceil((h-y)/TILE)+1;
 for(let gy=minGY;gy<=maxGY;gy++)for(let gx=minGX;gx<=maxGX;gx++){
  if(gx>=0&&gx<N&&gy>=0&&gy<N)continue;
  const xx=x+gx*TILE,yy=y+gy*TILE;
  const n=((gx*73856093)^(gy*19349663))>>>0;
  ctx.fillStyle=n%3===0?'#4f7b42':n%3===1?'#578548':'#608b4d';
  ctx.fillRect(xx,yy,TILE,TILE);
  ctx.fillStyle='#719b58';ctx.fillRect(xx+8+n%18,yy+9+(n>>>5)%19,4,3);
 }
 // Upper-floor cutaway: visible support facade underneath the raised floor.
 if(player.z===1){
  const groundY=y-WALL;
  ctx.fillStyle='#646c61';ctx.fillRect(x-12,groundY+N*TILE-WALL,12,WALL);
  ctx.fillStyle='#70786b';ctx.fillRect(x+N*TILE,groundY+N*TILE-WALL,12,WALL);
  ctx.fillStyle='#77796e';ctx.fillRect(x,groundY+N*TILE-WALL,N*TILE,WALL);
  ctx.fillStyle='#d1c9b5';ctx.fillRect(x,groundY+N*TILE-WALL,N*TILE,5);
  for(let i=1;i<4;i++)line(x,groundY+N*TILE-WALL+i*WALL/4,x+N*TILE,groundY+N*TILE-WALL+i*WALL/4,'#60665e');
 }
 // A 5x5 orthogonal ground grid. All wall bases sit on its four edges.
 // The wall height is projected vertically UP, never down onto the floor.
 // North wall: full height visible behind the floor.
 polygon([[x,y-WALL],[x+size,y-WALL],[x+size,y],[x,y]],'#aaa99c');
 polygon([[x,y-WALL],[x+THICK,y-WALL-THICK],[x+size+THICK,y-WALL-THICK],[x+size,y-WALL]],'#e0dac8');
 for(let i=1;i<4;i++)line(x,y-WALL+i*WALL/4,x+size,y-WALL+i*WALL/4,'#8b8b80');
 // Raised-floor rim shows the thickness of the second-storey slab.
 if(player.z===1){
  ctx.fillStyle='#4c5149';ctx.fillRect(x-5,y,5,size);
  ctx.fillStyle='#b8a887';ctx.fillRect(x+size,y,5,size);
 }
 // Floor rendered after the north wall, so every floor tile remains visible.
 for(let row=0;row<N;row++)for(let col=0;col<N;col++){
  ctx.fillStyle=player.z===1?((row+col)%2?'#947959':'#a48966'):((row+col)%2?'#888f7d':'#979e8c');
  ctx.fillRect(x+col*TILE,y+row*TILE,TILE,TILE);
  ctx.strokeStyle='#646b5e';ctx.lineWidth=1;
  ctx.strokeRect(x+col*TILE+.5,y+row*TILE+.5,TILE,TILE);
 }
 // Both side walls are upright planes anchored to the vertical grid edges.
 // Their bases follow the 5-tile grid lines; their tops are WALL pixels higher.
 // Draw outward faces behind the south wall, which retains final draw priority.
 const SIDE=12;
 // Left side: tall face projected to the left of the western edge.
 polygon([[x-SIDE,y-WALL],[x,y-WALL],[x,y+size],[x-SIDE,y+size]],'#777d72');
 // Right side: tall face projected right of the eastern edge.
 polygon([[x+size,y-WALL],[x+size+SIDE,y-WALL],[x+size+SIDE,y+size],[x+size,y+size]],'#777d72');
 // Top caps run north-south along the grid boundaries, not horizontally across the wall.
 polygon([[x-SIDE,y-WALL],[x-SIDE+THICK,y-WALL-THICK],[x+THICK,y-WALL-THICK],[x,y-WALL]],'#d9d7c6');
 polygon([[x+size,y-WALL],[x+size+THICK,y-WALL-THICK],[x+size+SIDE+THICK,y-WALL-THICK],[x+size+SIDE,y-WALL]],'#d9d7c6');
 // Vertical faces use brick-height courses and tile-spaced joints.
 for(let row=1;row<4;row++){
  const yy=y-WALL+row*WALL/4;
  line(x-SIDE,yy,x,yy,'#5e675d');
  line(x+size,yy,x+size+SIDE,yy,'#5e675d');
 }
 for(let i=1;i<N;i++){
  const yy=y+i*TILE-WALL;
  line(x-SIDE,yy,x,yy,'#626a60');
  line(x+size,yy,x+size+SIDE,yy,'#626a60');
 }
 // Stairs are at the same grid location on both floors.
 const sx=x+STAIRS.x*TILE,sy=y+STAIRS.y*TILE;
 ctx.fillStyle=player.z===0?'#715b37':'#635443';ctx.fillRect(sx+4,sy+5,TILE-8,TILE-9);
 for(let i=0;i<4;i++){ctx.fillStyle=i%2?'#c7a467':'#ddbf83';ctx.fillRect(sx+6,sy+7+i*7,TILE-12,5);}
 // Upper floor has an exposed front floor slab, reinforcing its elevation.
 if(player.z===1){
  ctx.fillStyle='#665b4b';ctx.fillRect(x,y+size,size,12);
  ctx.fillStyle='#d0b68e';ctx.fillRect(x,y+size,size,4);
 }
 // Floor indicator (upper floor has a distinct wooden floor).
 if(player.z===1){ctx.fillStyle='#f0dfb0';ctx.font='bold 15px system-ui';ctx.fillText('Verdieping 2 · +1',x,y-WALL-18);}
 // Exterior wall faces are visible above the ground when approaching from outside.
 // The south facade retains the highest layer priority over indoor characters.
 if(!outside){
 // Player: simple top-down sprite, one grid tile at a time.
 const px=x+player.x*TILE+TILE/2,py=y+player.y*TILE+TILE/2;
 ctx.fillStyle='#30352e';ctx.fillRect(px-9,py+11,18,5);
 ctx.fillStyle='#384f76';ctx.fillRect(px-9,py-2,18,15);
 ctx.fillStyle='#d8b38c';ctx.fillRect(px-7,py-13,14,13);
 ctx.fillStyle='#493a2c';ctx.fillRect(px-8,py-15,16,5);
 ctx.fillStyle='#292c32';ctx.fillRect(px-8,py+11,6,6);ctx.fillRect(px+2,py+11,6,6);
 }
 // Horizontal south wall is always the final foreground layer.
 // South wall rises from the southern grid edge, rather than hanging below it.
 // Its lower edge meets the floor boundary; the floor remains drawn behind it.
 polygon([[x,y+size-WALL],[x+size,y+size-WALL],[x+size,y+size],[x,y+size]],'#9c9b8f');
 polygon([[x,y+size-WALL],[x+THICK,y+size-WALL-THICK],[x+size+THICK,y+size-WALL-THICK],[x+size,y+size-WALL]],'#ded9c8');
 // Door opening in the south wall: one full grid tile, at column 2.
 // Erase only the wall face in the opening, restoring the floor/grass behind it.
 const doorLeft=x+DOOR_X*TILE,doorTop=y+size-WALL;
 ctx.fillStyle=player.z===0?'#979e8c':'#a48966';
 ctx.fillRect(doorLeft,doorTop,TILE,WALL);
 // Threshold and dark door jambs.
 ctx.fillStyle='#5c4631';ctx.fillRect(doorLeft,doorTop,4,WALL);
 ctx.fillRect(doorLeft+TILE-4,doorTop,4,WALL);
 ctx.fillStyle='#d6bd85';ctx.fillRect(doorLeft+4,y+size-5,TILE-8,5);
 // Keep the upper wall visible on the second floor; doorway only on ground.
 if(player.z===1){
  ctx.fillStyle='#9c9b8f';ctx.fillRect(doorLeft,doorTop,TILE,WALL);
  ctx.fillStyle='#ded9c8';ctx.fillRect(doorLeft,doorTop,TILE,THICK);
 }
 for(let i=1;i<4;i++){
  const yy=y+size-WALL+i*WALL/4;
  line(x,yy,doorLeft,yy,'#86877c');
  line(doorLeft+TILE,yy,x+size,yy,'#86877c');
 }
 ctx.fillStyle='#d8d3c3';
 ctx.fillRect(x-THICK,y+size-WALL-THICK,THICK*2,THICK);
 ctx.fillRect(x+size-THICK,y+size-WALL-THICK,THICK*2,THICK);
 // Second storey is permanently part of the exterior silhouette.
 // Render a separate 64px facade ABOVE the ground-floor south wall.
 // Hide its front when the player is indoors so the current floor stays playable.
 if(outside){
  const upperBottom=y+size-WALL,upperTop=upperBottom-WALL;
  // Upper-floor west and east side elevations.
  polygon([[x-12,y-2*WALL],[x,y-2*WALL],[x,upperBottom],[x-12,upperBottom]],'#656e65');
  polygon([[x+size,y-2*WALL],[x+size+12,y-2*WALL],[x+size+12,upperBottom],[x+size,upperBottom]],'#6f786c');
  // Front wall, second floor, stacked directly above the lower facade.
  ctx.fillStyle='#aaa89a';ctx.fillRect(x,upperTop,size,WALL);
  ctx.fillStyle='#d9d4bf';ctx.fillRect(x,upperTop,size,5);
  ctx.fillStyle='#77786e';ctx.fillRect(x,upperBottom-5,size,5);
  for(let i=1;i<4;i++)line(x,upperTop+i*WALL/4,x+size,upperTop+i*WALL/4,'#89897e');
  // Two upper windows make the storey visually distinct from the doorway below.
  for(const col of [1,3]){
   const wx=x+col*TILE+6,wy=upperTop+17;
   ctx.fillStyle='#514d43';ctx.fillRect(wx-3,wy-3,34,37);
   ctx.fillStyle='#37677b';ctx.fillRect(wx,wy,28,28);
   ctx.fillStyle='#8fb2b8';ctx.fillRect(wx+12,wy,3,28);
   ctx.fillStyle='#8fb2b8';ctx.fillRect(wx,wy+12,28,3);
   ctx.fillStyle='#d6c8a8';ctx.fillRect(wx-4,wy+29,36,5);
  }
  // Roof edge projects above the second-storey facade.
  polygon([[x-12,upperTop],[x,upperTop-12],[x+size,upperTop-12],[x+size+12,upperTop]],'#756052');
  ctx.fillStyle='#b5a48b';ctx.fillRect(x-12,upperTop-3,size+24,5);
 }
 // Outside characters appear in front of the building facade; inside
 // characters remain occluded by the foreground south wall.
 if(outside){
  const px=x+player.x*TILE+TILE/2,py=y+player.y*TILE+TILE/2;
  ctx.fillStyle='#30352e';ctx.fillRect(px-9,py+11,18,5);
  ctx.fillStyle='#384f76';ctx.fillRect(px-9,py-2,18,15);
  ctx.fillStyle='#d8b38c';ctx.fillRect(px-7,py-13,14,13);
  ctx.fillStyle='#493a2c';ctx.fillRect(px-8,py-15,16,5);
  ctx.fillStyle='#292c32';ctx.fillRect(px-8,py+11,6,6);ctx.fillRect(px+2,py+11,6,6);
 }
}
// Grid movement, including the doorway and grass outside.
function route(tx,ty){
 if(!walkable(tx,ty))return;
 const queue=[[player.x,player.y]],seen=new Set([player.x+','+player.y]),prev=new Map();
 while(queue.length){
  const [cx,cy]=queue.shift();if(cx===tx&&cy===ty)break;
  for(const [dx,dy] of [[0,1],[1,0],[0,-1],[-1,0]]){
   const nx=cx+dx,ny=cy+dy,k=nx+','+ny;
   if(!walkable(nx,ny)||seen.has(k))continue;
   // All crossings of the southern wall must pass through the doorway.
   if((cy===N-1&&ny===N)||(cy===N&&ny===N-1))
    if(cx!==DOOR_X||nx!==DOOR_X)continue;
   seen.add(k);prev.set(k,[cx,cy]);queue.push([nx,ny]);
  }
 }
 const steps=[];let k=tx+','+ty;
 if(!seen.has(k))return;
 while(k!==player.x+','+player.y){
  const [cx,cy]=k.split(',').map(Number);steps.unshift([cx,cy]);
  const p=prev.get(k);k=p[0]+','+p[1];
 }
 path=steps;
}
canvas.addEventListener('pointerdown',e=>{
 const box=canvas.getBoundingClientRect();
 const tx=Math.floor((e.clientX-box.left-originX)/TILE),ty=Math.floor((e.clientY-box.top-originY)/TILE);
 route(tx,ty);
});
addEventListener('keydown',e=>{
 const delta={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
 if(delta){e.preventDefault();route(player.x+delta[0],player.y+delta[1]);}
});
setInterval(()=>{
 if(!path.length)return;
 const [x,y]=path.shift();player.x=x;player.y=y;
 if(stairsAt(x,y)){player.z=1-player.z;path=[];}
 paint();
},160);
addEventListener('resize',paint);paint();

</script>
