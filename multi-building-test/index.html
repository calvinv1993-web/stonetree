<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Stonetree — 2.5D rastertest</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171a1b}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}</style><canvas id="map"></canvas><script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const TILE=40,N=5,WALL=64,THICK=6;
function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath();ctx.fill();}
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function paint(){
 const d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
 canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);
 ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingEnabled=false;
 ctx.fillStyle='#171a1b';ctx.fillRect(0,0,w,h);
 const size=N*TILE,x=Math.round((w-size)/2),y=Math.round((h-size-WALL)/2);
 // A 5x5 orthogonal ground grid. All wall bases sit on its four edges.
 // The wall height is projected vertically UP, never down onto the floor.
 // North wall: full height visible behind the floor.
 polygon([[x,y-WALL],[x+size,y-WALL],[x+size,y],[x,y]],'#aaa99c');
 polygon([[x,y-WALL],[x+THICK,y-WALL-THICK],[x+size+THICK,y-WALL-THICK],[x+size,y-WALL]],'#e0dac8');
 for(let i=1;i<4;i++)line(x,y-WALL+i*WALL/4,x+size,y-WALL+i*WALL/4,'#8b8b80');
 // Floor rendered after the north wall, so every floor tile remains visible.
 for(let row=0;row<N;row++)for(let col=0;col<N;col++){
  ctx.fillStyle=(row+col)%2?'#888f7d':'#979e8c';
  ctx.fillRect(x+col*TILE,y+row*TILE,TILE,TILE);
  ctx.strokeStyle='#646b5e';ctx.lineWidth=1;
  ctx.strokeRect(x+col*TILE+.5,y+row*TILE+.5,TILE,TILE);
 }
 // Side walls stay anchored to the west/east grid edges.
 // Their projected 2.5D wall faces extend OUTWARD, leaving the floor unchanged.
 const SIDE=24;
 // West: visible exterior face, full height at every point along the edge.
 polygon([[x-SIDE,y-WALL],[x,y-WALL],[x,y+size],[x-SIDE,y+size]],'#777d72');
 polygon([[x-SIDE,y-WALL],[x-SIDE+THICK,y-WALL-THICK],[x+THICK,y-WALL-THICK],[x,y-WALL]],'#d9d7c6');
 // East: same height and footprint, with a darker outer face.
 polygon([[x+size,y-WALL],[x+size+SIDE,y-WALL],[x+size+SIDE,y+size],[x+size,y+size]],'#818679');
 polygon([[x+size,y-WALL],[x+size+THICK,y-WALL-THICK],[x+size+SIDE+THICK,y-WALL-THICK],[x+size+SIDE,y-WALL]],'#d9d7c6');
 // Horizontal courses and grid-aligned vertical joints make the height legible.
 for(let i=1;i<4;i++){
  const yy=y-WALL+i*WALL/4;
  line(x-SIDE,yy,x,yy,'#5e675d');
  line(x+size,yy,x+size+SIDE,yy,'#656d61');
 }
 for(let i=1;i<N;i++){
  const yy=y+i*TILE;
  line(x-SIDE,yy-WALL,x,yy-WALL,'#626a60');
  line(x+size,yy-WALL,x+size+SIDE,yy-WALL,'#626a60');
 }

}
addEventListener('resize',paint);paint();
