<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Stonetree — 2.5D rastertest</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171a1b}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}</style><canvas id="map"></canvas><script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const TILE=40,N=5,WALL=64,THICK=6;
function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath();ctx.fill();}
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function paint(){
 const d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
 canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);
 ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingEnabled=false;
 ctx.fillStyle='#171a1b';ctx.fillRect(0,0,w,h);
 const size=N*TILE,x=Math.round((w-size)/2),y=Math.round((h-size)/2+WALL/3);
 // Strict orthogonal top-down grid, no isometric diamond.
 for(let row=0;row<N;row++)for(let col=0;col<N;col++){
  ctx.fillStyle=(row+col)%2?'#888f7d':'#979e8c';
  ctx.fillRect(x+col*TILE,y+row*TILE,TILE,TILE);
  ctx.strokeStyle='#646b5e';ctx.lineWidth=1;ctx.strokeRect(x+col*TILE+.5,y+row*TILE+.5,TILE,TILE);
 }
 // Four equal-height walls anchored to the four perimeter grid edges.
 // Far (north) and side walls are behind the floor foreground.
 // The front (south) wall is intentionally omitted from the foreground
 // until after side and rear faces, so the square remains readable.
 // Back wall: its front face hangs BELOW the north grid edge.
 polygon([[x,y-WALL],[x+size,y-WALL],[x+size,y],[x,y]],'#a6a69a');
 polygon([[x,y-WALL],[x+THICK,y-WALL-THICK],[x+size+THICK,y-WALL-THICK],[x+size,y-WALL]],'#ded9c8');
 // Side walls follow the vertical grid edges and project UP from them.
 polygon([[x-THICK,y-WALL-THICK],[x,y-WALL],[x,y+size-WALL],[x-THICK,y+size-WALL-THICK]],'#777f75');
 polygon([[x,y-WALL],[x+THICK,y-WALL-THICK],[x+THICK,y+size-WALL-THICK],[x,y+size-WALL]],'#c7c6b6');
 polygon([[x+size-THICK,y-WALL-THICK],[x+size,y-WALL],[x+size,y+size-WALL],[x+size-THICK,y+size-WALL-THICK]],'#777f75');
 polygon([[x+size,y-WALL],[x+size+THICK,y-WALL-THICK],[x+size+THICK,y+size-WALL-THICK],[x+size,y+size-WALL]],'#c7c6b6');
 // Front wall hangs below the south grid edge, as in Tibia.
 polygon([[x,y+size-WALL],[x+size,y+size-WALL],[x+size,y+size],[x,y+size]],'#9c9b8f');
 polygon([[x,y+size-WALL],[x+THICK,y+size-WALL-THICK],[x+size+THICK,y+size-WALL-THICK],[x+size,y+size-WALL]],'#ded9c8');
 // Minimal horizontal divisions show equal height, without brick textures.
 for(let i=1;i<4;i++){
  const yy=y+size-WALL+i*WALL/4;
  line(x,yy,x+size,yy,'#86877c');
 }
}
addEventListener('resize',paint);paint();
</script>
