<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Stonetree — drie muren</title><style>html,body{margin:0;width:100%;height:100%;background:#171a1b;overflow:hidden}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}</style><canvas id="map"></canvas><script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const TILE=48,HEIGHT=72,DEPTH=12;
function polygon(g,points,color){
 g.fillStyle=color;g.beginPath();g.moveTo(...points[0]);
 for(let i=1;i<points.length;i++)g.lineTo(...points[i]);
 g.closePath();g.fill();
}
// One wall sprite, anchored to one grid edge.
// Its cap is shifted UP-LEFT, with a flat front and a dark right edge.
function makeWall(){
 const c=document.createElement('canvas');
 c.width=TILE+DEPTH;c.height=HEIGHT+DEPTH;
 const g=c.getContext('2d');g.imageSmoothingEnabled=false;
 // The front occupies exactly one tile width, no oversized block.
 g.fillStyle='#849188';g.fillRect(DEPTH,DEPTH,TILE,HEIGHT);
 g.fillStyle='#9aa79d';g.fillRect(DEPTH+2,DEPTH+2,TILE-4,HEIGHT-5);
 // Exposed right edge: dark, narrow, and vertically aligned.
 polygon(g,[[TILE,0],[TILE+DEPTH,DEPTH],[TILE+DEPTH,DEPTH+HEIGHT],[TILE,HEIGHT]],'#526259');
 // Top cap: a 45-degree oblique projection toward upper-left.
 polygon(g,[[0,0],[TILE,0],[TILE+DEPTH,DEPTH],[DEPTH,DEPTH]],'#c5d1c5');
 return c;
}
const wall=makeWall();
function paint(){
 const d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
 canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);
 ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingEnabled=false;
 ctx.fillStyle='#171a1b';ctx.fillRect(0,0,w,h);
 const x=Math.round((w-TILE-DEPTH)/2),y=Math.round((h-HEIGHT-DEPTH)/2);
 ctx.drawImage(wall,x,y);
}
addEventListener('resize',paint);paint();
</script>
