<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Stonetree buildings</title><style>body{margin:0;background:#151515;color:white;font:14px system-ui;overflow:hidden}canvas{display:block;touch-action:none}footer{height:62px;display:flex;align-items:center;justify-content:space-around;background:#222}button{padding:10px;color:white;background:#444;border:1px solid #888;border-radius:5px}</style><canvas id="map"></canvas><footer><span id="status"></span><button id="reset">Reset</button></footer><script type="module">
import {BuildingWorld} from '../engine/building-world.mjs';
import {findPath} from '../engine/movement.mjs';
import {terrainAt} from '../engine/terrain.mjs';
import {drawTile,drawPlayer} from '../engine/pixel-renderer.mjs';
const world=new BuildingWorld([{x:0,y:-5,width:7,height:7,z:7,floors:2,material:'stone',doors:[{x:0,y:-2}],windows:[{x:3,y:-5}],stairs:{x:3,y:-2},holes:[{x:2,y:-3,z:6}]},{x:12,y:-4,width:6,height:6,z:7,floors:3,material:'wood',doors:[{x:12,y:-1}],windows:[{x:15,y:-4}],stairs:{x:15,y:-1},holes:[{x:13,y:-2,z:5}]}]);
const canvas=document.querySelector('#map'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');let p={x:-4,y:0,z:7},walkId=0;const S=38;const tileCache=new Map();let lastW=0,lastH=0,lastD=0;
function cachedTile(t,x,y){const key=[x,y,t.z??p.z,t.type,t.material??'',t.open??'',t.mask??'',t.below?.type??''].join(':');let image=tileCache.get(key);if(!image){image=document.createElement('canvas');image.width=S;image.height=S;drawTile(image.getContext('2d'),t,0,0,S,x,y);if(tileCache.size>=480)tileCache.clear();tileCache.set(key,image)}return image}
function blocked(x,y){const b=world.find(x,y);if(b){const t=world.tile(x,y,p.z);if(t?.type==='hole')return world.blocked(x,y,p.z+1);return world.blocked(x,y,p.z)}return p.z!==7||terrainAt(x,y).blocked}
// 2.5D exterior: roof raised above its footprint, with a height-dependent front facade.
function exterior(b){return p.z===b.groundZ&&!b.base.contains(p.x,p.y)&&Math.max(b.base.x-p.x,0,p.x-(b.base.x+b.base.width-1),b.base.y-p.y,p.y-(b.base.y+b.base.height-1))>2}
function facade(b,w,h){
 const a=b.base,left=w/2+(a.x-p.x)*S-S/2,top=h/2+(a.y-p.y)*S-S/2;
 const width=a.width*S,height=a.height*S,levelHeight=30,lift=b.floors*levelHeight;
 const timber=a.material==='wood',front=top+height;
 const wall=timber?'#876245':'#88938d',dark=timber?'#453224':'#434e4c',trim=timber?'#c09a66':'#bfc6b6';
 // South-facing facade is anchored to the real footprint, not pasted on top of the roof.
 ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(left+10,front+4,width+8,10);
 ctx.fillStyle=wall;ctx.fillRect(left,front-lift,width,lift);
 ctx.fillStyle=dark;ctx.fillRect(left,front-lift,5,lift);
 ctx.fillStyle=trim;ctx.fillRect(left+5,front-lift,width-10,4);
 for(let level=0;level<b.floors;level++){
  const yy=front-lift+level*levelHeight;
  ctx.fillStyle=dark;ctx.fillRect(left+4,yy+levelHeight-5,width-4,5);
  ctx.fillStyle=trim;ctx.fillRect(left+5,yy+levelHeight-7,width-10,2);
  for(let col=1;col<a.width-1;col+=2){
   const xx=left+col*S+S/2-10;
   ctx.fillStyle=dark;ctx.fillRect(xx-3,yy+7,26,18);
   ctx.fillStyle='#254958';ctx.fillRect(xx,yy+9,20,12);
   ctx.fillStyle='#9fc4c3';ctx.fillRect(xx+2,yy+10,16,4);
   ctx.fillStyle=trim;ctx.fillRect(xx+9,yy+9,3,12);
   ctx.fillRect(xx-4,yy+23,28,3);
  }
 }
 // Side wall: a darker return face gives the building a consistent 2.5D silhouette.
 ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(left+width,front-lift);ctx.lineTo(left+width+9,front-lift-8);ctx.lineTo(left+width+9,front-8);ctx.lineTo(left+width,front);ctx.closePath();ctx.fill();
 // Roof stays aligned to the top of the facade; the sloped front eave covers the join.
 const roofDepth=height,roofTop=top-lift,roofRow=S;
 // Roof uses exactly the same tile footprint as the interior (width x height).
 // Height is expressed only through vertical elevation and the facade below.
 ctx.fillStyle=timber?'#342b25':'#402e2c';ctx.fillRect(left-5,roofTop-5,width+10,roofDepth+8);
 for(let row=0;row<a.height;row++)for(let col=0;col<a.width;col++){
  const x=a.x+col,y=a.y+row,t=world.tile(x,y,b.roofZ);
  ctx.drawImage(cachedTile(t,x,y),left+col*S,roofTop+row*roofRow,S,roofRow+1);
 }
 ctx.fillStyle='rgba(20,17,17,.22)';ctx.fillRect(left,roofTop+roofDepth*.52,width,roofDepth*.48);
 ctx.fillStyle=timber?'#d0a575':'#c79a8a';ctx.fillRect(left-3,roofTop+roofDepth*.47,width+6,4);
 ctx.fillStyle=dark;ctx.fillRect(left-6,front-lift-6,width+12,8);
 ctx.fillStyle=trim;ctx.fillRect(left-3,front-lift-6,width+6,2);
 ctx.fillStyle=trim;ctx.fillRect(left+3,front-lift-5,width-6,2);
 ctx.fillStyle='rgba(0,0,0,.17)';ctx.fillRect(left+7,front-lift+2,width-14,5);
}

function paint(){const w=innerWidth,h=innerHeight-62,d=Math.min(devicePixelRatio||1,2);if(w!==lastW||h!==lastH||d!==lastD){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);canvas.style.width=w+'px';canvas.style.height=h+'px';lastW=w;lastH=h;lastD=d}ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#151515';ctx.fillRect(0,0,w,h);for(let dy=-Math.ceil(h/S/2)-1;dy<=Math.ceil(h/S/2)+1;dy++)for(let dx=-Math.ceil(w/S/2)-1;dx<=Math.ceil(w/S/2)+1;dx++){const x=p.x+dx,y=p.y+dy,sx=w/2+dx*S-S/2,sy=h/2+dy*S-S/2;const buildingAt=world.find(x,y),raised=buildingAt&&exterior(buildingAt);const t=raised?null:world.visibleTile(x,y,p);if(t){ctx.drawImage(cachedTile(t,x,y),sx,sy);if(p.z<7){const building=world.find(x,y),edge=building?.base.boundary(x,y);if(edge){const south=y===building.base.y+building.base.height-1,east=x===building.base.x+building.base.width-1;ctx.fillStyle='rgba(5,9,12,.30)';ctx.fillRect(sx+3,sy+S-7,S-6,7);if(south){ctx.fillStyle=building.base.material==='wood'?'#46382d':'#454e4c';ctx.fillRect(sx+3,sy+S-5,S-3,5);ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(sx+5,sy+S,S-5,Math.min(10,(7-p.z)*4))}if(east){ctx.fillStyle='rgba(12,18,19,.48)';ctx.fillRect(sx+S-6,sy+3,6,S-3)}}}}else{const ground=terrainAt(x,y);ctx.drawImage(cachedTile(ground,x,y),sx,sy);if(p.z<7){ctx.fillStyle='rgba(8,14,20,.70)';ctx.fillRect(sx,sy,S,S);ctx.fillStyle='rgba(155,185,185,.13)';ctx.fillRect(sx,sy,S,1)}}}for(const b of world.buildings)if(exterior(b))facade(b,w,h);drawPlayer(ctx,w/2-S/2,h/2-S/2,S);status.textContent=(p.z===7?'Begane grond':'Verdieping '+(7-p.z))+' · Z'+p.z}
// Adapter: use the shared weighted A* movement engine without changing building collision.
const navigation={
 getTile(x,y,z){if(Math.abs(x-p.x)>30||Math.abs(y-p.y)>30)return null;const b=world.find(x,y);if(!b&&z!==7)return null;return {ground:{moveCost:terrainCost(x,y,z)}}},
 canWalk(x,y,z){return z===p.z&&Math.abs(x-p.x)<=30&&Math.abs(y-p.y)<=30&&!blocked(x,y)}
};
function terrainCost(x,y,z){return z!==7||world.find(x,y)?1:terrainAt(x,y).moveCost}
function path(tx,ty){return findPath(navigation,{...p},{x:tx,y:ty,z:p.z},{maxVisited:1800})}
function transition(){const b=world.find(p.x,p.y);if(!b)return false;const t=world.tile(p.x,p.y,p.z);let next=null;if(t?.type==='stairs'&&p.z>b.groundZ-b.floors+1)next=p.z-1;else if(t?.type==='hole')next=p.z+1;if(next===null||next>b.groundZ||next<b.groundZ-b.floors+1||world.blocked(p.x,p.y,next))return false;p.z=next;return true}
async function walk(r){const id=++walkId;for(const {x,y,z} of r){if(id!==walkId||z!==p.z||blocked(x,y))return false;p.x=x;p.y=y;const changed=transition();paint();if(changed)return true;await new Promise(resolve=>setTimeout(resolve,100*terrainCost(x,y,z)))}return id===walkId}
async function door(b,x,y){if(p.z!==b.groundZ)return;if(Math.abs(p.x-x)+Math.abs(p.y-y)!==1){let best=null;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,c=y+dy;if(blocked(a,c))continue;const r=path(a,c);if(r&&(!best||r.length<best.length))best=r}if(!best||!await walk(best))return}if(Math.abs(p.x-x)+Math.abs(p.y-y)===1){b.base.toggleDoor(x,y,p);paint()}}
canvas.addEventListener('pointerup',e=>{const r=canvas.getBoundingClientRect(),x=p.x+Math.round((e.clientX-r.left-r.width/2)/S),y=p.y+Math.round((e.clientY-r.top-r.height/2)/S),b=world.find(x,y);if(b?.base.doors.has(x+','+y)&&p.z===b.groundZ){void door(b,x,y);return}if(x===p.x&&y===p.y)return;if(blocked(x,y))return;const rpath=path(x,y);if(rpath)void walk(rpath)});document.querySelector('#reset').onclick=()=>{walkId++;p={x:-4,y:0,z:7};paint()};addEventListener('resize',paint);paint();
</script>
