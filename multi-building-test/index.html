<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Stonetree — drie hoge dunne muren</title><style>html,body{margin:0;width:100%;height:100%;background:#171a1b;overflow:hidden}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}</style><canvas id="map"></canvas><script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const TILE=48,HEIGHT=94,DEPTH=6;
function poly(g,p,color){g.fillStyle=color;g.beginPath();g.moveTo(...p[0]);for(let i=1;i<p.length;i++)g.lineTo(...p[i]);g.closePath();g.fill();}
function makeWall(){
 const c=document.createElement('canvas');c.width=TILE+DEPTH;c.height=HEIGHT+DEPTH;
 const g=c.getContext('2d');g.imageSmoothingEnabled=false;
 // Tibia-style oblique projection: front at x=0..48; wall depth recedes
 // up and to the RIGHT. The front is not shifted down/right by its depth.
 const y=DEPTH;
 g.fillStyle='#4a372c';g.fillRect(0,y,TILE,HEIGHT);
 const colors=['#9c7759','#b18b69','#8e6b51','#a78162','#967156'];
 for(let row=0;row<12;row++){
  const yy=y+row*8,shift=(row%2)*12;
  for(let bx=-24;bx<TILE+24;bx+=24){
   const l=Math.max(0,bx+shift),rr=Math.min(TILE,bx+shift+22);
   if(rr<=l)continue;
   g.fillStyle=colors[((row*3+Math.floor((bx+24)/24)*2)%colors.length+colors.length)%colors.length];
   g.fillRect(l,yy+1,rr-l,6);
   g.fillStyle='#c5a080';g.fillRect(l+1,yy+1,Math.max(0,rr-l-2),1);
  }
 }
 // Narrow visible depth at the RIGHT, drawn behind the front.
 // Bottom stays horizontal, avoiding the previous protruding triangle.
 poly(g,[[TILE,DEPTH],[TILE+DEPTH,0],[TILE+DEPTH,HEIGHT],[TILE,HEIGHT+DEPTH]],'#655043');
 // Repaint the face so the side never overlaps the brick pattern.
 g.fillStyle='#4a372c';g.fillRect(0,DEPTH,TILE,0);
 // The cap slopes up-right, consistent with Tibia's 2.5D wall projection.
 poly(g,[[0,DEPTH],[DEPTH,0],[TILE+DEPTH,0],[TILE,DEPTH]],'#bfa186');
 g.fillStyle='#e1c3a0';g.fillRect(DEPTH+1,1,TILE-2,2);
 g.fillStyle='#765c48';g.fillRect(0,DEPTH,TILE,2);
 return c;
}
const wall=makeWall();
function paint(){
 const d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
 canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);
 ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingEnabled=false;
 ctx.fillStyle='#171a1b';ctx.fillRect(0,0,w,h);
 const x=Math.round((w-(TILE*3+DEPTH))/2),y=Math.round((h-wall.height)/2);
 for(let i=0;i<3;i++)ctx.drawImage(wall,x+i*TILE,y);
}
addEventListener('resize',paint);paint();
</script>
