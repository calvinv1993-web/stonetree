<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Stonetree buildings</title><style>body{margin:0;background:#151515;color:white;font:14px system-ui;overflow:hidden}canvas{display:block;touch-action:none}footer{height:62px;display:flex;align-items:center;justify-content:space-around;background:#222}button{padding:10px;color:white;background:#444;border:1px solid #888;border-radius:5px}</style><canvas id="map"></canvas><footer><span id="status"></span><button id="down">Omlaag</button><button id="up">Omhoog</button><button id="reset">Reset</button></footer><script type="module">
import {BuildingWorld} from '../engine/building-world.mjs';
const world=new BuildingWorld([{x:0,y:-5,width:7,height:7,z:7,floors:2,material:'stone',doors:[{x:0,y:-2}],windows:[{x:3,y:-5}],stairs:{x:3,y:-2},holes:[{x:2,y:-3,z:6}]},{x:12,y:-4,width:6,height:6,z:7,floors:3,material:'wood',doors:[{x:12,y:-1}],windows:[{x:15,y:-4}],stairs:{x:15,y:-1},holes:[{x:13,y:-2,z:5}]}]);
const canvas=document.querySelector('#map'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');let p={x:-4,y:0,z:7},walkId=0;const S=38;
function blocked(x,y){const b=world.find(x,y);return b?world.blocked(x,y,p.z):p.z!==7}
function paint(){const w=innerWidth,h=innerHeight-62,d=devicePixelRatio||1;canvas.width=w*d;canvas.height=h*d;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#151515';ctx.fillRect(0,0,w,h);for(let dy=-Math.ceil(h/S/2)-1;dy<=Math.ceil(h/S/2)+1;dy++)for(let dx=-Math.ceil(w/S/2)-1;dx<=Math.ceil(w/S/2)+1;dx++){const x=p.x+dx,y=p.y+dy,sx=w/2+dx*S-S/2,sy=h/2+dy*S-S/2;const t=world.visibleTile(x,y,p)??{type:p.z===7?'grass':'void'};const color={grass:'#517b4c',void:'#151515',roof:t.material==='wood'?'#7b4b32':'#73554e',wall:t.material==='wood'?'#76533a':'#676a6c',floor:t.material==='wood'?'#ae875a':'#92918b',door:t.open?'#b78e55':'#54351f',window:'#75b5d1',stairs:'#d4b05d',hole:'#25252a'};ctx.fillStyle=color[t.type]??'#666';ctx.fillRect(sx,sy,S-1,S-1);if(t.type==='roof'){ctx.strokeStyle='#b18a75';for(let i=9;i<S;i+=12){ctx.beginPath();ctx.moveTo(sx,sy+i);ctx.lineTo(sx+S,sy+i);ctx.stroke()}}if(t.type==='stairs'){ctx.strokeStyle='#66502e';for(let i=9;i<30;i+=7){ctx.beginPath();ctx.moveTo(sx+7,sy+i);ctx.lineTo(sx+30,sy+i);ctx.stroke()}}}ctx.fillStyle='#ffdc72';ctx.beginPath();ctx.arc(w/2,h/2,11,0,Math.PI*2);ctx.fill();status.textContent='('+p.x+','+p.y+') Z'+p.z}
function path(tx,ty){const key=(x,y)=>x+','+y,q=[[p.x,p.y]],prev=new Map([[key(p.x,p.y),null]]);for(let i=0;i<q.length&&i<1800;i++){const [x,y]=q[i];if(x===tx&&y===ty){let k=key(x,y),r=[];while(prev.get(k)!==null){r.unshift(k.split(',').map(Number));k=prev.get(k)}return r}for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(Math.abs(nx-p.x)>30||Math.abs(ny-p.y)>30||prev.has(k)||blocked(nx,ny))continue;prev.set(k,key(x,y));q.push([nx,ny])}}return null}
async function walk(r){const id=++walkId;for(const [x,y] of r){if(id!==walkId)return;p.x=x;p.y=y;paint();await new Promise(resolve=>setTimeout(resolve,100))}}
function floor(direction){const b=world.find(p.x,p.y);if(!b?.stairs||b.stairs.x!==p.x||b.stairs.y!==p.y)return;const next=p.z+direction;if(next>b.groundZ||next<b.groundZ-b.floors+1)return;if(world.blocked(p.x,p.y,next))return;walkId++;p.z=next;paint()}
async function door(b,x,y){if(p.z!==b.groundZ)return;if(Math.abs(p.x-x)+Math.abs(p.y-y)!==1){let best=null;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,c=y+dy;if(blocked(a,c))continue;const r=path(a,c);if(r&&(!best||r.length<best.length))best=r}if(!best)return;await walk(best)}if(Math.abs(p.x-x)+Math.abs(p.y-y)===1){b.base.toggleDoor(x,y,p);paint()}}
canvas.addEventListener('pointerup',e=>{const r=canvas.getBoundingClientRect(),x=p.x+Math.round((e.clientX-r.left-r.width/2)/S),y=p.y+Math.round((e.clientY-r.top-r.height/2)/S),b=world.find(x,y);if(b?.base.doors.has(x+','+y)&&p.z===b.groundZ){void door(b,x,y);return}if(x===p.x&&y===p.y){floor(-1);return}if(blocked(x,y))return;const rpath=path(x,y);if(rpath)void walk(rpath)});document.querySelector('#up').onclick=()=>floor(-1);document.querySelector('#down').onclick=()=>floor(1);document.querySelector('#reset').onclick=()=>{walkId++;p={x:-4,y:0,z:7};paint()};addEventListener('resize',paint);paint();
</script>
