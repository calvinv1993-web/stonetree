<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Stonetree — gebouwtest</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171a1b;font-family:system-ui,-apple-system,sans-serif}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;touch-action:none}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #f0c778;outline-offset:2px}#status{position:fixed;left:12px;top:12px;max-width:calc(100vw - 190px);margin:0;padding:8px 10px;background:#171a1be8;color:#e7d8b6;font:12px system-ui;pointer-events:none;border:1px solid #676457;border-radius:5px;box-shadow:0 3px 12px #0007}#doorControl{position:fixed;right:14px;bottom:max(24px,env(safe-area-inset-bottom));z-index:5;padding:12px 18px;background:#5e4732;color:#fff1d1;border:2px solid #c5a67a;border-radius:5px;font-weight:700;touch-action:manipulation}#doorControl[hidden],#lootPanel[hidden],#takeLoot[hidden],#inventoryContents[hidden]{display:none}.game-panel{background:#211f1bed;color:#e9d8b4;border:1px solid #8e7853;border-radius:6px;box-shadow:0 6px 20px #0009;backdrop-filter:blur(4px)}.panel-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 11px;background:#373026;border-bottom:1px solid #67563d;font-size:13px;font-weight:700;letter-spacing:.03em}.panel-body{padding:11px}.icon-button{width:29px;height:29px;border:1px solid #7d694a;border-radius:4px;background:#4c4030;color:#f6e3ba;font-size:19px;line-height:1}#inventoryPanel{position:fixed;right:12px;top:12px;z-index:7;width:158px;max-width:calc(100vw - 24px)}#inventoryContents{display:flex;align-items:center;gap:9px;font-size:13px}#inventoryContents:before{content:'●';display:grid;place-items:center;width:27px;height:27px;flex:none;border:1px solid #b28c3d;border-radius:4px;background:#49391e;color:#e4b74d;font-size:17px}#lootPanel{position:fixed;right:12px;top:105px;z-index:8;width:210px;max-width:calc(100vw - 48px)}#lootContents{margin:0 0 12px;padding:10px;border:1px solid #544937;border-radius:4px;background:#181713;color:#f1dfb9;font-size:13px}#takeLoot{display:block;width:100%;min-height:40px;border:1px solid #bb9961;border-radius:4px;background:#705338;color:#fff1d1;font-weight:700}#takeLoot:active,#doorControl:active{filter:brightness(1.2)}@media(max-width:390px){#inventoryPanel{width:142px}#status{max-width:calc(100vw - 175px);font-size:11px}}#inventoryPanel{width:192px;max-height:min(76vh,620px);overflow:auto}#inventoryContents{display:block}#inventoryContents:before{display:none}.equipment-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:9px}.equipment-slot{height:48px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid #65553e;background:#29261f;box-shadow:inset 1px 1px #171511,inset -1px -1px #484032;color:#c7b593}.equipment-slot .slot-symbol{font-size:18px;line-height:1}.equipment-slot .slot-label{font-size:9px;line-height:1;white-space:nowrap}.equipment-slot.is-empty{opacity:.76}.bag-header{padding:7px 9px;border-top:1px solid #67563d;border-bottom:1px solid #67563d;background:#373026;font-size:12px;font-weight:700;display:flex;justify-content:space-between}.bag-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:9px}.bag-slot{position:relative;aspect-ratio:1;border:1px solid #62543e;background:#29261f;box-shadow:inset 1px 1px #171511,inset -1px -1px #484032;display:flex;align-items:center;justify-content:center;color:#e5bb54}.bag-slot .stack-count{position:absolute;right:2px;bottom:1px;font-size:10px;font-weight:700;color:#fff1c7;text-shadow:1px 1px #000}.bag-slot .coin-symbol{font-size:19px}.bag-empty{font-size:11px;color:#97876d;padding:0 9px 9px}@media(max-width:390px){#inventoryPanel{width:174px}} .bag-slot.is-equippable,.equipment-slot{cursor:pointer;touch-action:manipulation}.bag-slot.is-equippable:active,.equipment-slot:active{background:#55442b}.equipment-slot:not(.is-empty){border-color:#c6a368;color:#f1d29a} </style></head><body><button id="doorControl" type="button" hidden>Open deur</button><section id="lootPanel" class="game-panel" hidden aria-label="Loot"><div class="panel-header"><span>Rat corpse</span><button id="closeLoot" class="icon-button" type="button" aria-label="Sluit loot">×</button></div><div class="panel-body"><p id="lootContents"></p><button id="takeLoot" type="button">Take all</button></div></section><section id="inventoryPanel" class="game-panel" aria-label="Inventory"><div class="panel-header"><span>Inventory</span><button id="toggleInventory" class="icon-button" type="button" aria-label="Verberg inventory" aria-expanded="true">−</button></div><div id="inventoryContents"><div class="equipment-grid" aria-label="Equipment slots"><div class="equipment-slot is-empty" data-slot="amulet"><span class="slot-symbol">◇</span><span class="slot-label">Amulet</span></div><div class="equipment-slot is-empty" data-slot="helmet"><span class="slot-symbol">♙</span><span class="slot-label">Helmet</span></div><div class="equipment-slot is-empty" data-slot="backpack"><span class="slot-symbol">▣</span><span class="slot-label">Backpack</span></div><div class="equipment-slot is-empty" data-slot="weapon"><span class="slot-symbol">⚔</span><span class="slot-label">Weapon</span></div><div class="equipment-slot is-empty" data-slot="armor"><span class="slot-symbol">♜</span><span class="slot-label">Armor</span></div><div class="equipment-slot is-empty" data-slot="shield"><span class="slot-symbol">⬡</span><span class="slot-label">Shield</span></div><div class="equipment-slot is-empty" data-slot="ring"><span class="slot-symbol">○</span><span class="slot-label">Ring</span></div><div class="equipment-slot is-empty" data-slot="legs"><span class="slot-symbol">Ⅱ</span><span class="slot-label">Legs</span></div><div class="equipment-slot is-empty" data-slot="ammo"><span class="slot-symbol">➶</span><span class="slot-label">Ammo</span></div></div><div class="bag-header"><span>Backpack</span><span id="bagCapacity">0 / 20</span></div><div id="bagGrid" class="bag-grid" aria-label="Backpack slots"></div><div id="equipmentStats" class="bag-empty">ATK 0 · DEF 0 · ARM 0</div></div></section><canvas id="map" tabindex="0" aria-label="Gebouwtest: tik om te lopen of gebruik de pijltjestoetsen"></canvas><output id="status" aria-live="polite"></output><script src="./src/data/buildings.js"></script>
