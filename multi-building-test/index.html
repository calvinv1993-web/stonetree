<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Stonetree — gebouwtest</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171a1b}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;touch-action:none}</style></head><body><canvas id="map"></canvas><script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const TILE=40,N=5,HEIGHT=64,THICK=6,SIDE=12;
const BUILDING={width:N,height:N,door:{side:'south',col:2},stairs:{x:1,y:1},floors:[{material:'stone',windows:[]},{material:'wood',windows:[1,3]}]};
const player={x:2,y:2,z:0};let path=[],originX=0,originY=0,screenY=0;
const inside=(x,y)=>x>=0&&x<N&&y>=0&&y<N;
const outside=()=>!inside(player.x,player.y);
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function line(x,y,X,Y,c){ctx.strokeStyle=c;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke();}
function poly(p,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(...p[0]);for(let i=1;i<p.length;i++)ctx.lineTo(...p[i]);ctx.closePath();ctx.fill();}
function windowAt(wx,wy){
 rect(wx-3,wy-3,34,37,'#514d43');rect(wx,wy,28,28,'#37677b');
 rect(wx+12,wy,3,28,'#8fb2b8');rect(wx,wy+12,28,3,'#8fb2b8');
 rect(wx-4,wy+29,36,5,'#d6c8a8');
}
function playerSprite(x,y){
 rect(x-9,y+11,18,5,'#30352e');rect(x-9,y-2,18,15,'#384f76');
 rect(x-7,y-13,14,13,'#d8b38c');rect(x-8,y-15,16,5,'#493a2c');
 rect(x-8,y+11,6,6,'#292c32');rect(x+2,y+11,6,6,'#292c32');
}
function grass(x,y,w,h){
 for(let gy=Math.floor(-y/TILE)-1;gy<=Math.ceil((h-y)/TILE)+1;gy++)
 for(let gx=Math.floor(-x/TILE)-1;gx<=Math.ceil((w-x)/TILE)+1;gx++){
  const n=((gx*73856093)^(gy*19349663))>>>0,xx=x+gx*TILE,yy=y+gy*TILE;
  rect(xx,yy,TILE,TILE,['#4f7b42','#578548','#608b4d'][n%3]);
  rect(xx+8+n%18,yy+9+(n>>>5)%19,4,3,'#719b58');
 }
}
function facade(x,baseY,level,door){
 // One authoritative facade per physical storey, shared by interior and exterior views.
 const top=baseY-HEIGHT;
 rect(x,top,N*TILE,HEIGHT,'#aaa89a');
 for(let i=1;i<4;i++)line(x,top+i*HEIGHT/4,x+N*TILE,top+i*HEIGHT/4,'#89897e');
 rect(x,top,N*TILE,5,'#d9d4bf');
 if(door){
  const dx=x+BUILDING.door.col*TILE;
  rect(dx,top,TILE,HEIGHT,'#62513e');
  rect(dx+5,top+4,TILE-10,HEIGHT-9,'#4b382c');
  rect(dx+8,top+8,TILE-16,HEIGHT-15,'#6d5035');
  rect(dx+5,baseY-5,TILE-10,5,'#d6bd85');
 }else for(const col of BUILDING.floors[level].windows)
  windowAt(x+col*TILE+6,top+17);
 rect(x,baseY-5,N*TILE,5,'#77786e');
}
function exterior(x,y){
 // y is the building ground-floor grid origin. Ground and upper floor share
 // the same x/y footprint. Higher storeys are displaced UP by HEIGHT.
 const base=y+N*TILE;
 rect(x-12,base-2*HEIGHT,12,2*HEIGHT,'#656e65');
 rect(x+N*TILE,base-2*HEIGHT,12,2*HEIGHT,'#6f786c');
 facade(x,base,0,true);
 facade(x,base-HEIGHT,1,false);
 poly([[x-12,base-2*HEIGHT],[x,base-2*HEIGHT-12],[x+N*TILE,base-2*HEIGHT-12],[x+N*TILE+12,base-2*HEIGHT]],'#756052');
 rect(x-12,base-2*HEIGHT-3,N*TILE+24,5,'#b5a48b');
}
// One physical building: each storey has a fixed world elevation.
// Camera follows the player's z. The geometry does not change between views.
const VOID_TILES=new Set(['1,1','1,2','2,1','2,2']);
function floorTile(x,y,col,row,level){
 const wood=BUILDING.floors[level].material==='wood';
 rect(x+col*TILE,y+row*TILE,TILE,TILE,wood?((col+row)%2?'#947959':'#a48966'):((col+row)%2?'#888f7d':'#979e8c'));
 ctx.strokeStyle='#646b5e';ctx.lineWidth=1;
 ctx.strokeRect(x+col*TILE+.5,y+row*TILE+.5,TILE,TILE);
}
function staircase(x,y,level){
 const sx=x+BUILDING.stairs.x*TILE,sy=y+BUILDING.stairs.y*TILE;
 rect(sx+4,sy+5,TILE-8,TILE-9,level===0?'#715b37':'#635443');
 for(let i=0;i<4;i++)rect(sx+6,sy+7+i*7,TILE-12,5,i%2?'#c7a467':'#ddbf83');
}
function walls(x,y){
 const size=N*TILE;
 rect(x,y-HEIGHT,size,HEIGHT,'#aaa99c');
 for(let i=1;i<4;i++)line(x,y-HEIGHT+i*HEIGHT/4,x+size,y-HEIGHT+i*HEIGHT/4,'#8b8b80');
 poly([[x,y-HEIGHT],[x+THICK,y-HEIGHT-THICK],[x+size+THICK,y-HEIGHT-THICK],[x+size,y-HEIGHT]],'#e0dac8');
 rect(x-SIDE,y-HEIGHT,SIDE,size+HEIGHT,'#777d72');
 rect(x+size,y-HEIGHT,SIDE,size+HEIGHT,'#777d72');
 rect(x-SIDE,y-HEIGHT,SIDE+THICK,THICK,'#d9d7c6');
 rect(x+size,y-HEIGHT,SIDE+THICK,THICK,'#d9d7c6');
}
function renderFloor(x,y,level,holes){
 walls(x,y);
 for(let row=0;row<N;row++)for(let col=0;col<N;col++){
  if(holes&&VOID_TILES.has(col+','+row))continue;
  floorTile(x,y,col,row,level);
 }
 staircase(x,y,level);
}
function interior(x,upperY,level){
 const size=N*TILE;
 if(level===0){
  renderFloor(x,upperY,0,false);
  playerSprite(x+(player.x+.5)*TILE,upperY+(player.y+.5)*TILE);
  // A door is an actual opening, not a filled-in brown rectangle.
  facade(x,upperY+size,0,true);
  return;
 }
 // The downstairs room remains at its own world elevation.
 // Clip it to the actual upper-floor stairwell; never paint a fake
 // duplicate of its floor onto the upstairs floor.
 const lowerY=upperY+HEIGHT;
 ctx.save();ctx.beginPath();
 for(const key of VOID_TILES){
  const [col,row]=key.split(',').map(Number);
  ctx.rect(x+col*TILE,upperY+row*TILE,TILE,TILE);
 }
 ctx.clip();
 // Show the actual lower storey at its projected depth through the void.
 // Its walls, stairs and floor are drawn from the same geometry functions.
 renderFloor(x,lowerY,0,false);
 ctx.restore();
 // The upper floor is a real slab with an open stairwell.
 renderFloor(x,upperY,1,true);
 // Show slab thickness at the edges of the void.
 for(const key of VOID_TILES){
  const [col,row]=key.split(',').map(Number);
  if(!VOID_TILES.has(col+','+(row-1)))rect(x+col*TILE,upperY+row*TILE,TILE,5,'#d4bc91');
  if(!VOID_TILES.has((col-1)+','+row))rect(x+col*TILE,upperY+row*TILE,5,TILE,'#665b4b');
 }
 playerSprite(x+(player.x+.5)*TILE,upperY+(player.y+.5)*TILE);
 // Ground-floor entrance remains physically BELOW the upper floor.
 // It is drawn before the upper south wall, never substituted for it.
 // The downstairs entrance remains visible BELOW the upstairs slab.
 // Do not paint the lower facade over the upstairs room or windows.
 facade(x,upperY+size,1,false);
 // Ground-floor south facade is occluded by the upper wall except for
 // the portion physically beneath the upper floor's lower edge.
 ctx.save();ctx.beginPath();ctx.rect(x,upperY+size+HEIGHT,size,HEIGHT);ctx.clip();
 facade(x,lowerY+size,0,true);
 ctx.restore();
 ctx.fillStyle='#f0dfb0';ctx.font='bold 15px system-ui';
 ctx.fillText('Verdieping 2',x,upperY-HEIGHT-18);
}
function paint(){
 const d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
 canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);
 ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingEnabled=false;
 const x=Math.round(w/2-(player.x+.5)*TILE);
 const y=Math.round(h/2-(player.y+.5)*TILE+player.z*HEIGHT);
 originX=x;originY=y;
 grass(x,y,w,h);
 if(outside()){exterior(x,y);playerSprite(x+(player.x+.5)*TILE,y+(player.y+.5)*TILE);}
 else interior(x,y,player.z);
}
function walkable(x,y){
 if(inside(x,y))return true;
 return player.z===0&&((x===BUILDING.door.col&&y>=N&&y<=N+5)||(y>=N+1&&y<=N+5&&x>=-7&&x<N+8));
}
function route(tx,ty){
 if(!walkable(tx,ty))return;
 const queue=[[player.x,player.y]],seen=new Set([player.x+','+player.y]),prev=new Map();
 while(queue.length){
  const [cx,cy]=queue.shift();if(cx===tx&&cy===ty)break;
  for(const [dx,dy] of [[0,1],[1,0],[0,-1],[-1,0]]){
   const nx=cx+dx,ny=cy+dy,k=nx+','+ny;
   if(!walkable(nx,ny)||seen.has(k))continue;
   if((cy===N-1&&ny===N)||(cy===N&&ny===N-1))
    if(cx!==BUILDING.door.col||nx!==BUILDING.door.col)continue;
   seen.add(k);prev.set(k,[cx,cy]);queue.push([nx,ny]);
  }
 }
 let k=tx+','+ty;if(!seen.has(k))return;
 const steps=[];
 while(k!==player.x+','+player.y){
  const [cx,cy]=k.split(',').map(Number);steps.unshift([cx,cy]);
  const p=prev.get(k);k=p[0]+','+p[1];
 }
 path=steps;
}
canvas.addEventListener('pointerdown',e=>{
 const box=canvas.getBoundingClientRect();
 route(Math.floor((e.clientX-box.left-originX)/TILE),Math.floor((e.clientY-box.top-originY)/TILE));
});
addEventListener('keydown',e=>{
 const delta={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
 if(delta){e.preventDefault();route(player.x+delta[0],player.y+delta[1]);}
});
setInterval(()=>{
 if(!path.length)return;
 const [x,y]=path.shift();player.x=x;player.y=y;
 if(x===BUILDING.stairs.x&&y===BUILDING.stairs.y){player.z=1-player.z;path=[];}
 paint();
},160);
addEventListener('resize',paint);paint();
</script></body></html>
