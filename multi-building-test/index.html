<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Stonetree — drie oblieke muren</title><style>html,body{margin:0;width:100%;height:100%;background:#171a1b;overflow:hidden}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}</style><canvas id="map"></canvas><script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const TILE=48,HEIGHT=82,OFFSET=22;
function polygon(g,pts,color){
 g.fillStyle=color;g.beginPath();g.moveTo(...pts[0]);
 for(let i=1;i<pts.length;i++)g.lineTo(...pts[i]);
 g.closePath();g.fill();
}
// One sprite per 48px grid position; the visible top is projected
// 22px up and left, while the front stays orthographic.
function wallSprite(){
 const c=document.createElement('canvas');
 c.width=TILE+OFFSET;c.height=HEIGHT+OFFSET;
 const g=c.getContext('2d');g.imageSmoothingEnabled=false;
 const frontX=OFFSET,frontY=OFFSET;
 g.fillStyle='#7c8a81';g.fillRect(frontX,frontY,TILE,HEIGHT);
 g.fillStyle='#93a198';g.fillRect(frontX+1,frontY+2,TILE-2,HEIGHT-5);
 g.fillStyle='#526259';g.fillRect(frontX,frontY+HEIGHT-3,TILE,3);
 // A 45-degree oblique top plane: back edge up-left.
 polygon(g,[[0,0],[TILE,0],[TILE+OFFSET,OFFSET],[OFFSET,OFFSET]],'#bac9bd');
 polygon(g,[[1,1],[TILE-1,1],[TILE+OFFSET-3,OFFSET-3],[OFFSET+2,OFFSET-3]],'#d1dcd0');
 g.fillStyle='#687b70';g.fillRect(OFFSET,OFFSET-2,TILE,2);
 return c;
}
const wall=wallSprite();
function paint(){
 const d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
 canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);
 ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingEnabled=false;
 ctx.fillStyle='#171a1b';ctx.fillRect(0,0,w,h);
 const x=Math.round((w-TILE*3-OFFSET)/2),y=Math.round((h-HEIGHT-OFFSET)/2);
 // Three distinct, adjoining wall sprites, not a single stretched image.
 for(let i=0;i<3;i++)ctx.drawImage(wall,x+i*TILE,y);
 // One exposed end cap; internal edges do not have side faces.
 polygon(ctx,[[x+TILE*3+OFFSET,y+OFFSET],[x+TILE*3,y],[x+TILE*3,y+HEIGHT],[x+TILE*3+OFFSET,y+HEIGHT+OFFSET]],'#43534b');
 polygon(ctx,[[x+TILE*3,y],[x+TILE*3+OFFSET,y+OFFSET],[x+TILE*3+OFFSET-3,y+OFFSET],[x+TILE*3-3,y]],'#6e8074');
}
addEventListener('resize',paint);paint();
</script>
