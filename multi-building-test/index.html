<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Stonetree — muren</title><style>html,body{margin:0;width:100%;height:100%;background:#171a1b;overflow:hidden}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}</style><canvas id="map"></canvas><script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const TILE=48,THICK=10,HEIGHT=64;
function wallSprite(){
 const c=document.createElement('canvas');
 // One wall occupies a 48px tile horizontally, with its height above the tile.
 c.width=TILE;c.height=TILE+HEIGHT;
 const g=c.getContext('2d');g.imageSmoothingEnabled=false;
 const top=HEIGHT-9,depth=9;
 // Front plane, normal stone shade.
 g.fillStyle='#78847e';g.fillRect(0,top+depth,TILE,HEIGHT-depth);
 g.fillStyle='#67736d';g.fillRect(0,top+depth+11,TILE,2);
 g.fillStyle='#a0aaa3';g.fillRect(1,top+depth+2,TILE-2,2);
 g.fillStyle='#59655f';g.fillRect(0,top+HEIGHT-3,TILE,3);
 // Bright top plane: clearly separate from the vertical front.
 g.fillStyle='#c5cec5';g.fillRect(0,top,TILE,depth);
 g.fillStyle='#e0e6da';g.fillRect(1,top+1,TILE-2,2);
 g.fillStyle='#a0aba2';g.fillRect(0,top+depth-2,TILE,2);
 // Right-side plane, darker to create 2.5D volume.
 g.fillStyle='#45514e';g.fillRect(TILE-7,top+depth,7,HEIGHT-depth);
 g.fillStyle='#64716b';g.fillRect(TILE-7,top+depth,2,HEIGHT-depth-2);
 // End grain on the top-right.
 g.fillStyle='#87938b';g.fillRect(TILE-7,top,7,depth);
 g.fillStyle='#5b6861';g.fillRect(TILE-2,top,2,depth);
 return c;
}
const sprite=wallSprite();
function paint(){
 const d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
 canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);
 ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingEnabled=false;
 ctx.fillStyle='#171a1b';ctx.fillRect(0,0,w,h);
 const x=Math.round((w-TILE*3)/2),y=Math.round(h/2);
 for(let i=0;i<3;i++)ctx.drawImage(sprite,x+i*TILE,y-HEIGHT);
}
addEventListener('resize',paint);paint();
</script>
